[workspace]
resolver = "2"
members = [
    "crates/kestryx-store",
    "crates/kestryx-net",
    "crates/kestryx-meta",
    "crates/kestryx-java",
    "crates/kestryx-auth",
    "crates/kestryx-skins",
    "crates/kestryx-diagnostics",
    "crates/kestryx-instances",
    "crates/kestryx-loaders",
    "crates/kestryx-mods",
    "crates/kestryx-import",
    "crates/kestryx-launch",
    "crates/kestryx-cli",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "GPL-3.0-or-later"
authors = ["Kestryx Contributors"]
repository = "https://github.com/kestryx/kestryx"

[workspace.dependencies]
anyhow = "1.0"
thiserror = "2.0"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
toml = "0.8"
tokio = { version = "1.40", features = ["rt-multi-thread", "macros", "fs", "io-util", "process", "sync", "time", "net", "signal"] }
blake3 = { version = "1.5", default-features = false, features = ["std"] }
sha1 = "0.10"
sha2 = "0.10"
md-5 = "0.10"
hex = "0.4"
uuid = { version = "1.10", features = ["v3", "v4", "serde"] }
chrono = { version = "0.4", features = ["serde"] }
zip = { version = "9", default-features = false, features = ["deflate"] }
flate2 = "1.0"
regex = "1.11"
clap = { version = "4.5", features = ["derive", "env"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }
tempfile = "3.13"
proptest = "1.5"
image = { version = "0.25", default-features = false, features = ["png", "webp"] }
base64 = "0.22"
chacha20poly1305 = "0.10"
rand = "0.8"
url = "2.5"
futures = "0.3"

[profile.release]
opt-level = "s"
lto = "fat"
codegen-units = 1
strip = "symbols"
panic = "abort"
