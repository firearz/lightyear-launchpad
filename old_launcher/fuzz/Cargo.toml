[package]
name = "kestryx-fuzz"
version = "0.0.0"
publish = false
edition = "2024"

[package.metadata]
cargo-fuzz = true

[dependencies]
libfuzzer-sys = "0.4"
kestryx-import = { path = "../crates/kestryx-import" }
kestryx-instances = { path = "../crates/kestryx-instances" }
kestryx-meta = { path = "../crates/kestryx-meta" }
serde_json = "1.0"

[[bin]]
name = "fuzz_zip_paths"
path = "fuzz_targets/fuzz_zip_paths.rs"
test = false
doc = false
bench = false

[[bin]]
name = "fuzz_version_json"
path = "fuzz_targets/fuzz_version_json.rs"
test = false
doc = false
bench = false
