name: Kestryx CI — Tests, Budgets & Nightly Smoke

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "0 3 * * *"

permissions:
  contents: read

jobs:
  rust-matrix:
    name: Rust Core & JDK Cross-Check (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-java@c5195efecf7bdfc987ee827a7198b11521c0002c # v4.7.0
        with:
          distribution: "temurin"
          java-version: "25"
      - uses: dtolnay/rust-toolchain@stable
      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf
      - name: Run Workspace Unit, Property, Golden Matrix & Live JDK UUID Tests
        run: cargo test --workspace --all-targets
      - name: Run CLI Performance Budget Gate (Play-to-Spawn <= 300ms & CAS 10-Instance Dedup < 5MB)
        run: |
          cargo run --release -p kestryx-cli -- bench play-to-spawn --runs 30
          cargo run --release -p kestryx-cli -- bench cas-ten-instances

  ui-and-budgets:
    name: Frontend Bundle Budget, Visual Regression & WCAG 2.2 AA
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "24"
      - name: Install Frontend Dependencies
        working-directory: apps/desktop
        run: npm ci
      - name: Build SPA & Enforce <= 150 KB Gzip Initial JS Budget
        run: |
          npm --prefix apps/desktop run build
          node scripts/check-bundle-budget.mjs
      - name: Run Playwright E2E, 60fps Scroll, <16ms Search & Dark/Light Screenshot Matrix
        working-directory: apps/desktop
        run: |
          npx playwright install --with-deps chromium
          npx playwright test

  supply-chain-audit:
    name: Supply Chain Audit (cargo-deny & cargo-audit)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: EmbarkStudios/cargo-deny-action@90cd23ebef6aa3ff9ebff9febd82eb8b14691043 # v2.0.5

  linux-xvfb-smoke:
    name: Nightly Real Game Launch Smoke Test (Linux Xvfb + Software GL)
    runs-on: ubuntu-latest
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-java@c5195efecf7bdfc987ee827a7198b11521c0002c # v4.7.0
        with:
          distribution: "temurin"
          java-version: "25"
      - name: Install Xvfb and Mesa llvmpipe Software OpenGL
        run: |
          sudo apt-get update
          sudo apt-get install -y xvfb libgl1-mesa-dri mesa-utils libopenal1
      - name: Verify Vanilla, Fabric & NeoForge Launch Pipeline under Xvfb
        run: |
          xvfb-run -a -s "-screen 0 1280x720x24" cargo test -p kestryx-launch
