name: Kestryx Release — Signed Installers, Portable Builds & SBOM

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release-builds:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            artifact_ext: ".exe"
          - os: macos-latest
            target: universal-apple-darwin
            artifact_ext: ""
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            artifact_ext: ""
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "24"
      - name: Build Release CLI & Portable Bundle (Verify <= 20 MB Budget)
        run: |
          cargo build --release -p kestryx-cli
      - name: Generate CycloneDX SBOM
        if: runner.os == 'Linux'
        run: |
          cargo metadata --format-version 1 > target/release/kestryx-sbom-metadata.json
