[workspace]
resolver = "2"
members = [
    "crates/lightyield-core",
    "crates/lightyield-cli",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
authors = ["Light Yield Team"]
license = "GPL-3.0-or-later"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
panic = "abort"
strip = true
