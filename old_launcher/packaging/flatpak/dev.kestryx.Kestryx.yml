app-id: dev.kestryx.Kestryx
runtime: org.gnome.Platform
runtime-version: "47"
sdk: org.gnome.Sdk
sdk-extensions:
  - org.freedesktop.Sdk.Extension.rust-stable
  - org.freedesktop.Sdk.Extension.node22
command: kestryx
finish-args:
  - --share=ipc
  - --socket=fallback-x11
  - --socket=wayland
  - --socket=pulseaudio
  - --device=dri
  - --share=network
  - --talk-name=org.freedesktop.secrets
modules:
  - name: kestryx
    buildsystem: simple
    build-commands:
      - cargo build --release -p kestryx-cli
      - install -Dm755 target/release/kestryx /app/bin/kestryx
    sources:
      - type: dir
        path: ../..
